name: Run NSE FnO Top Losers

on:
  schedule:
    # 9:15 AM IST = 03:45 AM UTC (Mon-Fri)
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-losers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute NSE FnO Losers Script
        run: python nse_fno_losers_to_excel.py

      - name: Locate Generated Report File
        id: find_report
        run: |
          LATEST_FILE=$(ls -t reports/NSE_FnO_Top_Losers_*.xlsx | head -n 1)
          echo "REPORT_FILE=$LATEST_FILE" >> $GITHUB_ENV
          echo "Found report file: $LATEST_FILE"

      - name: Send Email with NSE Losers Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "NSE FnO Top Losers Report"
          body: "Please find attached the NSE FnO Top Losers Report."
          to: ${{ secrets.MAIL_USERNAME }},${{ secrets.SECOND_MAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          attachments: ${{ env.REPORT_FILE }}
