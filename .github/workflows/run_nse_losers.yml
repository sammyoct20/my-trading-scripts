name: NSE FnO Losers Script (9:17 AM IST)

on:
  schedule:
    - cron: '47 3 * * *'  # 03:47 UTC = 09:17 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-losers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Losers Script
        run: python nse_fno_losers_to_excel.py

      - name: Commit and Push Output File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Auto-generated NSE Losers Report [skip ci]" || echo "No changes to commit"
          git push
