name: NSE FnO Losers Script (9:16 AM IST)

on:
  schedule:
    - cron: '46 3 * * 1-5'  # 03:46 UTC = 09:16 AM IST (Mon-Fri only)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-losers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Losers Script
        run: python nse_fno_losers_to_excel.py

      - name: Organize Files into Reports Directory
        run: |
          mkdir -p reports
          mv -f NSE_FnO_*.xlsx reports/ 2>/dev/null || true

      - name: Commit and Push Output File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Auto-generated NSE Losers Report in reports [skip ci]" || echo "No changes to commit"
          git push

      - name: Send Email with Excel Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📉 Daily NSE F&O Top Losers Report"
          to: ${{ secrets.MAIL_USERNAME }}, ${{ secrets.SECOND_MAIL }}
          from: GitHub Actions Scanner
          body: |
            Hello,

            The NSE Top Losers script execution has completed.
            Please find the newly generated Excel report attached.

            Regards,
            Automated Bot
          attachments: reports/*.xlsx
