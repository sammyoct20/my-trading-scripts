name: Run NSE FnO Top Losers

on:
  schedule:
    # 9:17 AM IST = 03:47 AM UTC (Mon-Fri)
    - cron: '47 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-losers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean Reports Directory
        run: rm -rf reports/*

      - name: Execute NSE FnO Losers Script
        run: python nse_fno_losers_to_excel.py

      - name: Send Email with NSE Losers Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "NSE FnO Top Losers Report"
          body: "Please find attached the NSE FnO Top Losers Report."
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.EMAIL_USERNAME }}
          attachments: reports/NSE_FnO_Top_Losers_*.xlsx
