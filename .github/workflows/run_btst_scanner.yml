name: Run BTST Scanner

on:
  schedule:
    # 3:15 PM IST = 09:45 AM UTC (Mon-Fri)
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-btst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute BTST Scanner Script
        run: python btst_scanner.py

      - name: Send Email with BTST Attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "BTST Live Calls Report"
          body: "Please find attached the BTST Live Calls Report."
          to: ${{ secrets.MAIL_USERNAME }},${{ secrets.SECOND_MAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          attachments: reports/btst_live_calls.xlsx
